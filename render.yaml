services:
  - type: web
    name: sistema-facturacion
    env: python
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p /data
      chmod 777 /data
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1 